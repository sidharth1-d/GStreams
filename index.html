<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GStreams</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">▶</span>
      <h1>GStreams</h1>
    </div>
    <button id="settingsBtn" class="icon-btn">Settings</button>
  </header>

  <main class="container">
    <section class="input-card">
      <form id="linkForm" class="input-row">
        <input
          id="linkInput"
          type="text"
          placeholder="Paste Google Drive folder or file link"
          autocomplete="off"
          required
        />
        <button type="submit" id="loadBtn" class="primary-btn">Load</button>
      </form>
      <p class="hint">
        Set folder access to <strong>Anyone with the link (Viewer)</strong>.
      </p>

      <div id="recentBar" class="recent-bar hidden">
        <span class="recent-label">Recent:</span>
        <div id="recentList" class="recent-list"></div>
      </div>
    </section>

    <div id="statusBanner" class="status-banner hidden"></div>

    <section id="toolbar" class="toolbar hidden">
      <div class="toolbar-top">
        <nav id="breadcrumbs" class="breadcrumbs"></nav>
        <div class="toolbar-actions">
          <button id="nativeFallbackBtn" class="secondary-btn">Native Grid</button>
        </div>
      </div>

      <div class="toolbar-bottom">
        <div id="filterTabs" class="filter-tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="video">Videos</button>
          <button class="tab" data-filter="image">Images</button>
          <button class="tab" data-filter="audio">Audio</button>
          <button class="tab" data-filter="folder">Folders</button>
          <button class="tab" data-filter="other">Other</button>
        </div>
        <input
          id="searchInput"
          type="search"
          class="search-input"
          placeholder="Search files..."
        />
      </div>
    </section>

    <section id="mediaGrid" class="media-grid"></section>

    <section id="nativeContainer" class="native-container hidden">
      <iframe id="nativeIframe" src="" frameborder="0"></iframe>
    </section>
  </main>

  <div id="playerModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="player"></div>
    <div class="modal-content player-modal">
      <div class="modal-header">
        <div class="player-title-wrap">
          <span id="playerBadge" class="badge">VIDEO</span>
          <h2 id="playerTitle">Filename</h2>
        </div>
        <button id="closePlayerBtn" class="close-btn" aria-label="Close">✕</button>
      </div>

      <div id="playerStage" class="player-stage"></div>

      <div class="player-controls">
        <div id="videoModeGroup" class="mode-group hidden">
          <button id="modePreviewBtn" class="chip-btn active">Embed Player</button>
          <button id="modeDirectBtn" class="chip-btn">Direct Video</button>
        </div>

        <div id="navGroup" class="nav-group hidden">
          <button id="prevMediaBtn" class="secondary-btn">Prev</button>
          <button id="nextMediaBtn" class="secondary-btn">Next</button>
        </div>

        <div class="external-links">
          <a id="openDriveLink" href="#" target="_blank" rel="noopener" class="secondary-btn">Open in Drive</a>
          <a id="downloadLink" href="#" target="_blank" rel="noopener" class="secondary-btn">Download</a>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="settings"></div>
    <div class="modal-content settings-modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettingsBtn" class="close-btn" aria-label="Close">✕</button>
      </div>

      <div class="settings-body">
        <p class="settings-note">
          Optional overrides stored locally in your browser. Leave blank for public folders.
        </p>

        <label class="field">
          <span>Apps Script URL (for private folders)</span>
          <input id="appsScriptInput" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        </label>

        <label class="field">
          <span>Custom proxy URL</span>
          <input id="workerInput" type="url" placeholder="https://your-worker.workers.dev/?url=" />
        </label>

        <label class="field">
          <span>Drive API key</span>
          <input id="apiKeyInput" type="text" placeholder="AIzaSy..." />
        </label>
      </div>

      <div class="settings-footer">
        <button id="clearSettingsBtn" class="secondary-btn">Reset</button>
        <button id="saveSettingsBtn" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
